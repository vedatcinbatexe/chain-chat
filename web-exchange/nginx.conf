server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard calls the API on its own origin, so the browser never makes a cross-origin request.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built files have a content hash in their name and can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/users, /groups/...) all load the single page.
    location / {
        try_files $uri /index.html;
    }
}
