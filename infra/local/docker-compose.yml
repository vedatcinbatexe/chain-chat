# ChainChat — local development environment
#
# Default services:                     postgres, anvil, contracts-deployer (one-off), api, dashboard, exchange
# Optional services (profile "extras"): redis, rabbitmq
#
#   docker compose up -d --build             # whole stack (rebuilds the API image)
#   docker compose --profile extras up -d    # + redis + rabbitmq
#   docker compose stop api                  # free port 5080 to run the API with `dotnet run` instead
#   docker compose down                      # stop (data kept)
#   docker compose down -v                   # stop and wipe all data

name: chainchat

services:
  postgres:
    image: postgres:17-alpine
    container_name: chainchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chainchat}
      POSTGRES_USER: ${POSTGRES_USER:-chainchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chainchat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local EVM chain for development and tests (replaces Base Sepolia locally).
  # Uses Anvil's default deterministic test accounts — never use them on a public network.
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    container_name: chainchat-anvil
    restart: unless-stopped
    entrypoint: ["anvil"]
    # Anvil dumps its state on SIGINT (not Docker's default SIGTERM), plus every 10 s as a safety net.
    stop_signal: SIGINT
    command:
      - --host=0.0.0.0
      - --port=8545
      - --chain-id=${ANVIL_CHAIN_ID:-31337}
      - --block-time=${ANVIL_BLOCK_TIME:-2}
      - --accounts=${ANVIL_ACCOUNTS:-20}
      - --state=/home/foundry/anvil-state.json
      - --state-interval=10
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    volumes:
      # Mounted on the foundry user's home so the non-root container user can write to it.
      - anvil-data:/home/foundry
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off job: deploys the contracts to Anvil and writes shared/deployments/anvil.json + ABIs.
  # Skips automatically when the contracts in anvil.json are already live on the chain.
  contracts-deployer:
    build:
      context: ../../contracts
    image: chainchat-contracts:local
    container_name: chainchat-contracts-deployer
    restart: "no"
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      RPC_URL: http://anvil:8545
      NETWORK: anvil
      # Anvil's public development account #0 — never use this key on a real network.
      DEPLOYER_PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    volumes:
      - ../../shared/deployments:/workspace/shared/deployments

  # ChainChat backend (REST API, later also SignalR, chain indexer and anchoring job).
  api:
    build:
      context: ../../backend
    image: chainchat-api:local
    container_name: chainchat-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
      contracts-deployer:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-chainchat};Username=${POSTGRES_USER:-chainchat};Password=${POSTGRES_PASSWORD:-chainchat}
      Database__MigrateOnStartup: "true"
      Chain__Network: anvil
      Chain__ChainId: ${ANVIL_CHAIN_ID:-31337}
      Chain__RpcUrls__0: http://anvil:8545
      Chain__DeploymentsPath: /app/deployments
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      # Contract addresses/ABIs written by the deploy job (Phase 2).
      - ../../shared/deployments:/app/deployments:ro

  # Admin dashboard (React): static files served by nginx, which also forwards /api to the API.
  # Keep it on port 5173, or change Admin__Domain / Admin__Uri on the API: the sign-in message is bound to this address.
  dashboard:
    build:
      context: ../../web-dashboard
    image: chainchat-dashboard:local
    container_name: chainchat-dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${DASHBOARD_PORT:-5173}:80"

  # Simulated exchange portal (React): create wallets with test balances, deposit into ChainChat, receive withdrawals.
  # Demo only — its API needs no login and exists only because Exchange__Enabled is on in Development.
  exchange:
    build:
      context: ../../web-exchange
    image: chainchat-exchange:local
    container_name: chainchat-exchange
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${EXCHANGE_PORT:-5174}:80"

  redis:
    image: redis:7-alpine
    container_name: chainchat-redis
    restart: unless-stopped
    profiles: ["extras"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: chainchat-rabbitmq
    restart: unless-stopped
    profiles: ["extras"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-chainchat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-chainchat}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  anvil-data:
  redis-data:
  rabbitmq-data:
