# ChainChat — local development infrastructure
#
# Default services (required by the SDD):  postgres, anvil
# Optional services (profile "extras"):     redis, rabbitmq
#
#   docker compose up -d                     # postgres + anvil
#   docker compose --profile extras up -d    # + redis + rabbitmq
#   docker compose down                      # stop (data kept)
#   docker compose down -v                   # stop and wipe all data

name: chainchat

services:
  postgres:
    image: postgres:17-alpine
    container_name: chainchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chainchat}
      POSTGRES_USER: ${POSTGRES_USER:-chainchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chainchat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local EVM chain for development and tests (replaces Base Sepolia locally).
  # Uses Anvil's default deterministic test accounts — never use them on a public network.
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    container_name: chainchat-anvil
    restart: unless-stopped
    entrypoint: ["anvil"]
    command:
      - --host=0.0.0.0
      - --port=8545
      - --chain-id=${ANVIL_CHAIN_ID:-31337}
      - --block-time=${ANVIL_BLOCK_TIME:-2}
      - --accounts=${ANVIL_ACCOUNTS:-20}
      - --state=/data/anvil-state.json
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    volumes:
      - anvil-data:/data
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chainchat-redis
    restart: unless-stopped
    profiles: ["extras"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: chainchat-rabbitmq
    restart: unless-stopped
    profiles: ["extras"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-chainchat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-chainchat}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  anvil-data:
  redis-data:
  rabbitmq-data:
