[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]

solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.4.0/",
    "forge-std/=dependencies/forge-std-1.11.0/src/",
]

# Tests read the shared Phase 3 vectors; the deploy script writes the deployment file for the backend and app.
fs_permissions = [
    { access = "read", path = "../shared/test-vectors/vectors" },
    { access = "read-write", path = "../shared/deployments" },
]

[fuzz]
runs = 1000

[fmt]
line_length = 120

[rpc_endpoints]
anvil = "http://localhost:8545"
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"

[dependencies]
forge-std = "1.11.0"
"@openzeppelin-contracts" = "5.4.0"

[soldeer]
# Remappings are maintained above, with shorter import paths.
remappings_generate = false
remappings_regenerate = false
